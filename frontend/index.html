<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#112e29">
  <title>Netwise | Internet services</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="ISP home">
        <span class="brand-mark">N</span>
        <span><strong id="brand-name">netwise</strong><small id="brand-tagline">INTERNET SERVICES</small></span>
      </a>

      <div class="workspace-label">WORKSPACE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span> Dashboard</button>
        <button class="nav-item" data-page="plans"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18.5h16M6.5 15V9.5M12 15V5M17.5 15v-3"/><path d="M4.5 6.5 9 9l5-5 5.5 3"/></svg></span> <span data-label="plans">Internet plans</span></button>
        <button class="nav-item" data-page="usage"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12h3l2-5 4 10 2.5-6 1.5 3h4"/><path d="M4 4.5h16v15H4z"/></svg></span> Data usage</button>
        <button class="nav-item" data-page="billing"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12v17l-2.5-1.7-3.5 1.7-3.5-1.7L6 20.5z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span> Billing</button>
        <button class="nav-item" data-page="complaints"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H7l-3.5 2v-5A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8.5 11.5h7M8.5 14.5h4"/></svg></span> <span data-label="support">Support & complaints</span> <span class="nav-count" id="complaint-count">2</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="help-card">
          <div class="help-icon">?</div>
          <strong>Need a hand?</strong>
          <p id="support-copy">Our support team is here to help.</p>
          <button class="text-button" data-page="complaints">Contact support <span>↗</span></button>
        </div>
        <div class="sidebar-user">
          <div class="avatar">RS</div>
          <div class="user-copy"><strong id="sidebar-name">Rahul Sharma</strong><small id="sidebar-role">Customer account</small></div>
          <button class="dots-button" id="profile-menu" aria-label="Account options">•••</button>
        </div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
        <div class="breadcrumbs"><span id="breadcrumb-brand">Netwise</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Dashboard</strong></div>
        <div class="topbar-actions">
          <label class="role-switch"><span>View as</span>
            <select id="role-select" aria-label="Choose view">
              <option value="customer">Customer</option>
              <option value="admin">Admin</option>
            </select>
          </label>
          <label class="customer-switch" id="customer-switch-wrap"><span>Account</span><select id="customer-select" aria-label="Choose customer"></select></label>
          <button class="button button-quiet settings-button" id="settings-button" type="button">Customize</button>
          <button class="icon-button notification-button" id="notifications-button" aria-label="Notifications"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><i></i></button>
          <div class="avatar avatar-top" id="top-avatar">RS</div>
        </div>
      </header>

      <section class="page-content">
        <div id="page-root"></div>
        <footer class="footer"><span id="footer-brand">© 2026 Netwise Internet Services</span><span><span class="status-dot"></span> <span id="service-status">All systems operational</span> <span class="footer-divider">·</span> <span id="portal-mode">Demo portal</span></span></footer>
      </section>
    </main>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>

  <dialog class="modal" id="modal">
    <form method="dialog" id="modal-form">
      <div class="modal-head"><div><p class="eyebrow" id="modal-eyebrow">NETWISE</p><h2 id="modal-title">New item</h2></div><button class="icon-button modal-close" value="cancel" aria-label="Close">×</button></div>
      <div id="modal-body"></div>
      <div class="modal-actions"><button class="button button-quiet" value="cancel">Cancel</button><button class="button button-primary" id="modal-submit" value="default">Save</button></div>
    </form>
  </dialog>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
